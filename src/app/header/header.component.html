<header>
    <!-- Top Bar -->
    <div class="top-bar">
      <div class="logo">
        <a routerLink="/">Balko</a>
      </div>

      <!-- Hamburger Button (Visible in Mobile) -->
      <button class="hamburger" [ngClass]="{'active': isMenuOpen}" (click)="toggleMenu()">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </button>
    </div>
  
    <!-- Bottom Bar (Navigation) -->
    <nav class="bottom-bar" [ngClass]="{'show': isMenuOpen}">
      <a routerLink="/" routerLinkActive="active" (click)="toggleMenu()">Home</a>
      <a routerLink="/about" routerLinkActive="active" (click)="toggleMenu()">About Us</a>
      <a routerLink="/contact" routerLinkActive="active" (click)="toggleMenu()">Contact</a>
    </nav>
  </header>
