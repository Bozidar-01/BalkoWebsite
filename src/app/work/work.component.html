<section class="intro">
    <div class="text">
      <h1>Аплицирај</h1>
    </div>
  
    <div class="animation">
        <dotlottie-player src="https://lottie.host/89c91db3-9292-4b37-8763-ddc8c171eda3/7Gz1ztATru.lottie" background="transparent" speed="1" style="width: 300px; height: 300px" loop autoplay></dotlottie-player>
    </div>
  
  <div class="text sub-heading" style="padding-bottom: 15px;">
    <h1>  
         Стани дел од тимот на Балко Маркети
    </h1>

  </div>
  </section>

  <section class="job-section" style="background: #fff; margin-bottom: 0 !important;">
    <div class="city-group">
      <h3>СТРУГА</h3>
      <div class="jobs">
        <button class="job-btn" (click)="openModal('КАСИЕРКА', 'strugaKasierka.jpg')">КАСИЕР/КА</button>
        <button class="job-btn" (click)="openModal('МАГАЦИОНЕР', 'magacin.jpg')">МАГАЦИОНЕР</button>
        <button class="job-btn" (click)="openModal('ВОЗАЧ СО Ц КАТ.', 'magacin.jpg')">ВОЗАЧ СО Ц КАТ.</button>
      </div>
    </div>
  
    <div class="city-group" style="margin-bottom: 0 !important">
      <h3>ОХРИД</h3>
      <div class="jobs">
        <button class="job-btn" (click)="openModal('КАСИЕРКА', 'ohridKasierka.jpg')">КАСИЕР/КА</button>
      </div>
    </div>
  
    <!-- Modal -->
    <div class="modal" *ngIf="modalOpen">
      <div class="modal-content">
        <span class="close-btn" (click)="closeModal()">×</span>
        <h3>{{ selectedTitle }}</h3>
        <img [src]="selectedImg" alt="Job Image" />
        <!-- <button class="apply-btn">ПРИЈАВИ СЕ</button> -->
      </div>
    </div>
  </section>
  

  <div class="comparison-table" #comparisonTable style="margin-top: 0 !important">
    <div class="row" style="background: #d62839;">
      <div class="cell">
        <p>РЕДОВНИ<br>МЕСЕЧНИ<br>ПЛАТИ</p>
      </div>
      <div class="cell">
        <img src="mesecniPlati.png" alt="X" class="x-img animate__animated" data-anim="animate__rotateInDownRight" />
      </div>
    </div>
    <div class="row" style="background:#f1a7c4;">
      <div class="cell">
        <img src="platenOdmor.png" alt="X" class="x-img animate__animated" data-anim="animate__rotateInDownLeft" />
      </div>
      <div class="cell">
        <p>ПЛАТЕН ГОДИШЕН<br>ОДМОР</p>
      </div>
    </div>
    <div class="row" style="background: #f4a261;">
      <div class="cell">
        <p>СЛОБОДНИ<br>ДЕНОВИ</p>
      </div>
      <div class="cell">
        <img src="slobodniDenovi.png" alt="X" class="x-img animate__animated" data-anim="animate__rotateInDownRight" />
      </div>
    </div>
    <div class="row" style="background: #2a9d8f;">
      <div class="cell">
        <img src="rabotnaAtmosfera.png" alt="X" class="x-img animate__animated" data-anim="animate__rotateInDownLeft" />
      </div>
      <div class="cell">
        <p>ПРИЈАТНА РАБОТНА<br>АТМОСФЕРА</p>
      </div>
    </div>
  </div>
