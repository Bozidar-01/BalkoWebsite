<div class="swiper" #swiperContainer>
    <div class="swiper-wrapper">
      <!-- <div class="swiper-slide">
        <img src="marketi/1.jpg" alt="">
      </div> -->
      <div class="swiper-slide">
        <img src="marketi/2.jpg" alt="">
      </div>
      <div class="swiper-slide">
        <img src="marketi/3.jpg" alt="">
      </div>
      <div class="swiper-slide">
        <img src="marketi/4.jpg" alt="">
      </div>
    </div>

    <!-- Navigation Arrows -->
    <div class="swiper-button-prev">
      <span class="chevron chevron-left"></span>
    </div>
    <div class="swiper-button-next">
      <span class="chevron chevron-right"></span>
    </div>
    <div class="swiper-pagination"></div>

</div>


<section class="intro">
  <div class="text">
    <h1>Локации</h1>
  </div>

  <div class="animation">
    <dotlottie-player
      src="https://lottie.host/1169e4da-0f9a-484b-b7e5-e937a77c465e/gIglIbifhe.lottie"
      background="transparent"
      speed="1"
      loop
      autoplay
    ></dotlottie-player>
  </div>

  <div class="text sub-heading" style="padding-bottom: 15px;">
    <h1><b>17 маркети</b> низ регионот</h1>
    <p>
      Посетете не и уживајте во секојдневното пазарење
    </p>
  </div>
</section>




  <div class="thirdContainer" #thirdContainer>

    <div class="firstPart offer-part" *ngFor="let market of markets">
        <h1 class="offer-part">
            <div style="font-size: 36px;">
                {{ market.name }}
            </div>
            <div style="font-size: 22px; text-transform: lowercase;">
              {{market.location}}
            </div>
            <div style="font-size: 28px;">
                {{market.city}}
          </div>
        </h1>
        <a style="text-decoration: none; color: #fff !important;" [href]="market.link">
        <button>Прикажи на мапа</button>
        </a>
      </div>


  </div>
