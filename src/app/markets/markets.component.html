<section class="intro">
  <div class="text">
<h1 class="typing">Локации</h1>
  </div>

  <div class="animation">
<dotlottie-player src="https://lottie.host/8ea9cc54-8eb6-48bf-a7aa-c5951372d4e1/4dLDyR7zfu.lottie" background="transparent" speed="1" style="width: 300px; height: 150px" loop autoplay></dotlottie-player>
  </div>

  <div class="text sub-heading" style="padding-bottom: 15px;">
    <h1 class="marketi17"><b>17 маркети</b> низ регионот</h1>
    <p>
      Посетете не и уживајте во секојдневното пазарење
    </p>
  </div>
</section>




  <div class="thirdContainer" #thirdContainer>

    <div class="firstPart offer-part" *ngFor="let market of markets">
        <h1 class="offer-part">
            <div style="font-size: 32px;">
                {{ market.name }}
            </div>
            <div style="font-size: 16px; font-weight: normal !important; text-transform: lowercase;">
              {{market.location}}
              <br *ngIf="!market.location">
            </div>
            <div style="font-size: 28px; font-weight: normal !important;">
                {{market.city}}
          </div>
        </h1>
        <a style="text-decoration: none; color: #fff !important;" [href]="market.link">
        <button>Прикажи на мапа</button>
        </a>
      </div>


  </div>
